# Publica uma Release a cada tag vX.Y.Z (ex.: v6.6.0).
# A tag precisa bater com "version" do package.json e o dist/ commitado precisa estar atualizado.
# A Release sai como rascunho e só vale para o auto-update depois de assinada: npm run sign-release -- vX.Y.Z
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      # Actions fixadas por SHA (a tag pode ser movida por quem controlar o repositório da action).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build e testes
        run: npm run check

      - name: Tag bate com o package.json
        run: npm run check-tag
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: dist/ commitado está atualizado
        run: git diff --exit-code -- dist/pokebot.user.js

      - name: Checksum
        shell: bash
        run: |
          cd dist
          sha256sum pokebot.user.js > pokebot.user.js.sha256
          cat pokebot.user.js.sha256

      - name: Notas da versão (CHANGELOG.md)
        id: meta
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          short_version="${version%.0}"
          echo "short_version=${short_version}" >> "$GITHUB_OUTPUT"
          awk -v v="$version" '
            { sub(/\r$/, "") }
            $0 ~ "^## \\[?"v"\\]?([ ]|$)" { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Nexo PokeBot v${short_version}" > release-notes.md
          fi
          cat release-notes.md

      - name: Empacotar o Nexo PokeBot para Windows
        run: npm run package:friend

      # Rascunho: o auto-update só enxerga a Release depois que o dono assina e publica
      # (npm run sign-release -- vX.Y.Z, na máquina dele; a chave privada nunca entra no GitHub).
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          name: Nexo PokeBot v${{ steps.meta.outputs.short_version }}
          body_path: release-notes.md
          files: |
            dist/pokebot.user.js
            dist/pokebot.user.js.sha256
            release/Nexo-PokeBot-*.zip
