# Publica uma Release a cada tag vX.Y.Z (ex.: v6.6.0).
# A tag precisa bater com "version" do package.json e o dist/ commitado precisa estar atualizado.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build e testes
        run: npm run check

      - name: Tag bate com o package.json
        run: npm run check-tag
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: dist/ commitado está atualizado
        run: git diff --exit-code -- dist/pokebot.user.js

      - name: Checksum
        run: |
          cd dist
          sha256sum pokebot.user.js > pokebot.user.js.sha256
          cat pokebot.user.js.sha256

      - name: Notas da versão (CHANGELOG.md)
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?"v"\\]?([ ]|$)" { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "PokeBot ${GITHUB_REF_NAME}" > release-notes.md
          fi
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/pokebot.user.js
            dist/pokebot.user.js.sha256
